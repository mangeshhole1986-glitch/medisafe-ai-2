<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediSafe — Smart Medication Manager</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#173b34;--muted:#687a74;--line:#dce7e2;--teal:#2d6a5f;--green:#2e8f55;--amber:#b07a1e;--red:#bf3a2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.brand{padding:15px 18px;font-weight:800;font-size:20px}.brand b{display:inline-grid;place-items:center;width:31px;height:31px;margin-right:8px;border-radius:9px;background:var(--teal);color:#fff}.tabs{display:flex;gap:5px;padding:0 12px 10px}.tab{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:#e7f0ee;color:var(--ink)}main{max-width:760px;margin:auto;padding:22px 15px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 15px #173b3410;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted)}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:750}.primary{background:var(--teal);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf2ef}.row:last-child{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.green{background:#e8f6ed;color:var(--green)}.yellow{background:#fbf1df;color:var(--amber)}.red{background:#fae9e6;color:var(--red)}input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin:5px 0 10px}label{font-size:12px;font-weight:750;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:8px}.actions>*{flex:1}.modal{position:fixed;inset:0;background:#10231f77;display:grid;align-items:end;z-index:20}.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto;max-width:620px;width:100%;margin:auto}.search{position:relative}.results{border:1px solid var(--line);border-radius:10px;overflow:hidden}.result{padding:11px;border-bottom:1px solid #edf2ef}.result:last-child{border:0}.result:hover{background:#e7f0ee}.small{font-size:12px}.stat{font-size:25px;font-weight:800}.patient{padding:10px;border-bottom:1px solid #edf2ef;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}.patient.active{background:#e7f0ee}.danger{color:var(--red)}.notice{padding:10px;border-radius:10px;background:#f7f9f8;color:var(--muted);font-size:12px;line-height:1.5}.dose-actions{display:flex;gap:6px}.dose-actions button{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px}
</style></head>
<body>
<header><div class="brand"><b>+</b>MediSafe</div><div class="tabs"><button class="tab active" data-role="patient">Patient</button><button class="tab" data-role="pharmacist">Pharmacist</button><button class="tab" data-role="doctor">Doctor</button></div></header>
<main id="app"></main>
<script>
const DRUGS=["Paracetamol","Ibuprofen","Aceclofenac","Diclofenac","Naproxen","Mefenamic Acid","Amoxicillin","Amoxicillin + Clavulanate","Azithromycin","Cefixime","Cefuroxime","Doxycycline","Clindamycin","Metronidazole","Nitrofurantoin","Ciprofloxacin","Ofloxacin","Moxifloxacin","Clarithromycin","Erythromycin","Linezolid","Pantoprazole","Omeprazole","Rabeprazole","Ondansetron","Domperidone","Lactulose","Sucralfate","Cetirizine","Levocetirizine","Fexofenadine","Montelukast","Salbutamol","Budesonide","Amlodipine","Telmisartan","Losartan","Olmesartan","Ramipril","Metoprolol","Atenolol","Hydrochlorothiazide","Furosemide","Atorvastatin","Rosuvastatin","Clopidogrel","Aspirin","Warfarin","Apixaban","Rivaroxaban","Spironolactone","Digoxin","Metformin","Glimepiride","Gliclazide","Sitagliptin","Empagliflozin","Dapagliflozin","Levothyroxine","Calcium Carbonate + Vitamin D3","Cholecalciferol","Folic Acid","Methylcobalamin","Vitamin B Complex","Vitamin C","Vitamin E","Albendazole","Ivermectin","Fluconazole","Acyclovir","Prednisolone","Dexamethasone","Methylprednisolone","Hydroxychloroquine","Methotrexate","Allopurinol","Febuxostat","Colchicine","Tamsulosin","Finasteride","Dutasteride","Sildenafil","Tadalafil","Clonazepam","Alprazolam","Escitalopram","Sertraline","Fluoxetine","Amitriptyline","Pregabalin","Gabapentin","Duloxetine","Levetiracetam","Sodium Valproate","Carbamazepine","Tramadol","Artificial Tears","Timolol","Latanoprost","Carboxymethylcellulose"];
const RULES=[[/warfarin/i,/ibuprofen|diclofenac|naproxen|mefenamic|aceclofenac|etodolac|nimesulide/i,"red","Increases bleeding risk"],[/warfarin/i,/aspirin|clopidogrel/i,"red","Increases major bleeding risk"],[/warfarin/i,/clarithromycin|erythromycin|azithromycin/i,"yellow","May increase INR/bleeding risk"],[/rivaroxaban|apixaban/i,/clarithromycin|itraconazole|ketoconazole/i,"red","May increase anticoagulant exposure and bleeding risk"],[/rivaroxaban|apixaban/i,/ibuprofen|diclofenac|naproxen|aspirin/i,"red","Increases bleeding risk"],[/clopidogrel/i,/omeprazole|esomeprazole/i,"yellow","May reduce clopidogrel activation"],[/acei|ramipril/i,/potassium|spironolactone/i,"yellow","May increase potassium"],[/telmisartan|losartan|olmesartan/i,/potassium|spironolactone/i,"yellow","May increase potassium"],[/sildenafil|tadalafil/i,/nitroglycerin|isosorbide/i,"red","Severe blood-pressure reduction; contraindicated"],[/metformin/i,/cimetidine/i,"yellow","May increase metformin exposure"],[/methotrexate/i,/trimethoprim|ibuprofen|diclofenac|naproxen/i,"red","Potentially serious methotrexate toxicity"],[/linezolid|tramadol/i,/sertraline|escitalopram|fluoxetine|duloxetine/i,"red","Serotonin toxicity risk"],[/levothyroxine/i,/calcium|iron|magnesium|sucralfate/i,"yellow","Can reduce levothyroxine absorption; separate doses"],[/ciprofloxacin|ofloxacin|moxifloxacin/i,/calcium|iron|magnesium/i,"yellow","Can reduce antibiotic absorption; separate doses"],[/metronidazole/i,/alcohol/i,"red","Avoid combination; serious adverse reaction risk"]];
const seed=[{id:"p1",name:"Ravindra Deshmukh",age:58,pharmacy:"Rajveer Medical",doctor:"Dr. S. Patil",meds:[{name:"Warfarin",dose:"5 mg",status:"confirmed",active:true},{name:"Losartan",dose:"50 mg",status:"confirmed",active:true}]},{id:"p2",name:"Sunita Kale",age:41,pharmacy:"Rajveer Medical",doctor:"Dr. A. Kulkarni",meds:[{name:"Metformin",dose:"500 mg",status:"confirmed",active:true}]}];
let patients=JSON.parse(localStorage.getItem("medisafe:patients")||"null")||seed,role="patient",selectedId="p1";
function save(){localStorage.setItem("medisafe:patients",JSON.stringify(patients))}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}function cls(t){return t==="red"?"red":t==="yellow"?"yellow":"green"}
function interaction(name,p){let hits=[];for(const m of p.meds.filter(x=>x.status==="confirmed"&&x.active!==false)){for(const r of RULES){if((r[0].test(name)&&r[1].test(m.name))||(r[1].test(name)&&r[0].test(m.name)))hits.push({with:m.name,tier:r[2],reason:r[3]})}}return hits}
function badge(t){return `<span class="pill ${cls(t)}">${t==="red"?"Pharmacist review":t==="yellow"?"Review recommended":"No known interaction"}</span>`}
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.role===role));document.getElementById("app").innerHTML=role==="patient"?patient():role==="pharmacist"?pharmacist():doctor();wire()}
function patient(){let p=patients.find(x=>x.id===selectedId)||patients[0];if(!p)return `<div class="card">No patient record.</div>`;let meds=p.meds.map((m,i)=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.dose)}</div></div><div>${m.status==="pending"?'<span class="pill yellow">Pending review</span>':m.active===false?'<span class="pill">Stopped</span>':badge(m.tier||"green")} ${m.active!==false&&m.status==="confirmed"?`<button class="dose-actions" data-stop="${i}">Stop</button>`:""}</div></div>`).join("");return `<h2>${esc(p.name)}</h2><div class="muted">${p.age} yrs · ${esc(p.pharmacy||"—")}</div>${patients.length>1?`<select id="patientSelect">${patients.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}<div class="card"><h3>Today's medication plan</h3>${meds||'<div class="muted">No medicines added yet.</div>'}</div><div class="grid"><div class="card"><div class="muted">Active medicines</div><div class="stat">${p.meds.filter(x=>x.status==="confirmed"&&x.active!==false).length}</div></div><div class="card"><div class="muted">Pending review</div><div class="stat">${p.meds.filter(x=>x.status==="pending").length}</div></div></div><button class="btn primary" id="addMed">+ Add medication</button><div class="notice" style="margin-top:12px">Safety checks are based on the supplied pharmacist-curated reference. They are not a diagnosis or a substitute for a pharmacist/doctor. Prescription details must be verified before use.</div>`}
function pharmacist(){let p=patients.find(x=>x.id===selectedId)||patients[0];return `<div class="grid"><div class="card"><h3>Patients</h3>${patients.map(x=>`<button class="patient ${x.id===p?.id?'active':''}" data-p="${x.id}"><b>${esc(x.name)}</b><div class="muted small">${x.age} yrs · ${x.meds.filter(m=>m.status==='pending').length} pending</div></button>`).join("")}<button class="btn outline" id="addPatient" style="margin-top:10px">+ Add patient</button></div><div class="card">${p?`<h3>${esc(p.name)} — medication review</h3><div class="muted small">${esc(p.pharmacy||"—")} · ${esc(p.doctor||"—")}</div>${p.meds.map((m,i)=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.dose)}</div></div><div>${m.status==='pending'?`<button class="btn primary" data-approve="${i}">Approve</button> <button class="btn outline danger" data-reject="${i}">Reject</button>`:badge(m.tier||"green")}</div></div>`).join("")||'<div class="muted">No medicines.</div>'}`:'No patient selected.'}</div></div>`}
function doctor(){let p=patients.find(x=>x.id===selectedId)||patients[0];return `<div class="grid"><div class="card"><h3>Patients</h3>${patients.map(x=>`<button class="patient ${x.id===p?.id?'active':''}" data-p="${x.id}"><b>${esc(x.name)}</b><div class="muted small">${x.age} yrs</div></button>`).join("")}</div><div class="card"><h3>Medication history — read only</h3>${p?p.meds.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.dose)} · ${m.active===false?'stopped':'active'}</div></div>${m.status==='rejected'?badge('red'):m.active===false?'<span class="pill">Stopped</span>':badge(m.tier||'green')}</div>`).join(""):''}</div></div>`}
function modal(html){let d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(d);return d}
function addMedication(){let p=patients.find(x=>x.id===selectedId);let d=modal(`<h2>Add medication</h2><label>Search medicine</label><input id="drug" placeholder="e.g. Metformin"><div id="results"></div><label>Dose</label><input id="dose" placeholder="e.g. 500 mg"><div id="check"></div><div class="actions"><button class="btn outline" id="cancel">Cancel</button><button class="btn primary" id="confirm" disabled>Add medication</button></div><div class="notice">You can also use your phone camera with the Scan option in the full Smart Med workflow. Always verify OCR results before scheduling.</div>`);let drug=d.querySelector('#drug'),res=d.querySelector('#results'),dose=d.querySelector('#dose'),check=d.querySelector('#check'),confirm=d.querySelector('#confirm'),chosen="";function update(){let q=drug.value.toLowerCase();res.innerHTML=q?`<div class="results">${DRUGS.filter(x=>x.toLowerCase().includes(q)).slice(0,7).map(x=>`<div class="result" data-x="${esc(x)}">${esc(x)}</div>`).join("")||'<div class="result muted">Not found — ask pharmacist to add it.</div>'}</div>`:'';res.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{chosen=x.dataset.x;drug.value=chosen;res.innerHTML='';let hits=interaction(chosen,p);let tier=hits.some(x=>x.tier==='red')?'red':hits.length?'yellow':'green';check.innerHTML=`<div class="card">${badge(tier)}${hits.map(h=>`<div class="small" style="margin-top:7px"><b>${esc(h.with)}:</b> ${esc(h.reason)}</div>`).join('')}</div>`;confirm.disabled=!dose.value.trim()});}drug.oninput=update;dose.oninput=()=>confirm.disabled=!(chosen&&dose.value.trim());d.querySelector('#cancel').onclick=()=>d.remove();confirm.onclick=()=>{let hits=interaction(chosen,p),tier=hits.some(x=>x.tier==='red')?'red':hits.length?'yellow':'green';p.meds.push({name:chosen,dose:dose.value.trim(),status:tier==='green'?'confirmed':'pending',active:true,tier});save();d.remove();render()}}
function addPatient(){let d=modal(`<h2>Add patient</h2><label>Name</label><input id="n"><label>Age</label><input id="a" type="number"><label>Pharmacy</label><input id="ph" value="Rajveer Medical"><label>Doctor</label><input id="dr"><div class="actions"><button class="btn outline" id="c">Cancel</button><button class="btn primary" id="ok">Add patient</button></div>`);d.querySelector('#c').onclick=()=>d.remove();d.querySelector('#ok').onclick=()=>{let n=d.querySelector('#n').value.trim();if(!n)return;let id='p'+Date.now();patients.push({id,name:n,age:d.querySelector('#a').value||'—',pharmacy:d.querySelector('#ph').value||'Rajveer Medical',doctor:d.querySelector('#dr').value||'—',meds:[]});selectedId=id;save();d.remove();render()}}
function wire(){document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{role=x.dataset.role;render()});document.querySelector('#patientSelect')?.addEventListener('change',e=>{selectedId=e.target.value;render()});document.querySelector('#addMed')?.addEventListener('click',addMedication);document.querySelector('#addPatient')?.addEventListener('click',addPatient);document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{selectedId=x.dataset.p;render()});document.querySelectorAll('[data-stop]').forEach(x=>x.onclick=()=>{let p=patients.find(y=>y.id===selectedId);p.meds[+x.dataset.stop].active=false;save();render()});document.querySelectorAll('[data-approve]').forEach(x=>x.onclick=()=>{let p=patients.find(y=>y.id===selectedId);p.meds[+x.dataset.approve].status='confirmed';save();render()});document.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>{let p=patients.find(y=>y.id===selectedId),m=p.meds[+x.dataset.reject];m.status='rejected';m.active=false;m.reason='Not approved by pharmacist';save();render()})}
render();
</script></body></html>
