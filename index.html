<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f6b"><meta name="description" content="Smart Med medication management application"><link rel="manifest" href="./manifest.json"><title>Smart Med</title><style>:root{--p:#087f6b;--bg:#f3f7f5;--ink:#15342f;--muted:#667b76;--line:#dce8e4;--good:#16834b;--warn:#b47716;--bad:#c4372d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:900;max-width:1180px;margin:auto}.app{max-width:1180px;margin:auto;padding:18px 14px 70px}.sidebar{float:left;width:205px;display:flex;flex-direction:column;gap:5px;position:sticky;top:70px}.nav{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;font-weight:750;color:var(--muted)}.nav.active{background:#e4f4f0;color:var(--p)}main{margin-left:220px}.hero{background:linear-gradient(135deg,#087f6b,#12a78e);color:white;border-radius:20px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:28px;margin:5px 0}.hero p{color:#d9f6ef;max-width:650px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800}.btn.primary{background:var(--p);color:white}.btn.white{background:white;color:var(--p)}.btn.danger{background:#fff0ee;color:var(--bad)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 6px 22px #123c3210}.stat{padding:16px}.stat span,.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:27px}.columns{display:grid;grid-template-columns:
