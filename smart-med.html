<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b5e"><title>Smart Med | MediSafe</title><style>:root{--b:#0b6b5e;--b2:#13947f;--bg:#f4f7f6;--ink:#102e29;--muted:#667b76;--line:#dce8e4;--good:#16834b;--warn:#b47716;--bad:#c4372d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:20}.head{max-width:1150px;margin:auto;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:900}.logo i{display:inline-grid;place-items:center;background:var(--b);color:white;border-radius:10px;width:34px;height:34px;font-style:normal;margin-right:8px}.roles{max-width:1150px;margin:auto;padding:0 12px 10px;display:flex;gap:6px}.role,.nav{border:0;background:transparent;padding:10px 13px;border-radius:10px;font-weight:800;color:var(--muted)}.role.on,.nav.on{background:#e5f4f0;color:var(--b)}main{max-width:1150px;margin:auto;padding:18px 14px 70px}.layout{display:grid;grid-template-columns:210px 1fr;gap:16px}.side,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 25px #103b3510}.side{padding:10px;height:max-content;position:sticky;top:110px}.nav{width:100%;text-align:left}.card{padding:17px;margin-bottom:14px}.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border:0}.hero .muted{color:#d9f3ee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.stat{font-size:28px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--b);color:white}.white{background:white;color:var(--b)}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.danger{color:var(--bad)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf2f0}.row:last-child{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.good{background:#e7f6ed;color:var(--good)}.warn{background:#fff2db;color:var(--warn)}.bad{background:#fae8e5;color:var(--bad)}.neutral{background:#eef2f1;color:#62736f}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.schedule{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.medbox{background:#f7faf9;border:1px solid var(--line);padding:12px;border-radius:12px}.progress{height:9px;background:#e5eeeb;border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:var(--b)}input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;margin:5px 0 10px}.modal{position:fixed;inset:0;background:#092b2677;z-index:50;display:grid;place-items:end}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:20px}.result{padding:11px;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:18px;right:16px;background:#123b35;color:#fff;padding:13px 16px;border-radius:12px;z-index:80}.empty{text-align:center;padding:25px;color:var(--muted)}.timeline{border-left:2px solid var(--line);padding-left:15px}.timeline div{margin-bottom:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.nav{min-width:max-content}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:500px){.roles .role{flex:1;padding:9px 4px}.grid{grid-template-columns:1fr 1fr}.head{padding:11px}.schedule{grid-template-columns:58px 1fr}}</style></head><body><header class="top"><div class="head"><div class="logo"><i>+</i>Smart Med</div><div id="clock" class="muted small"></div></div><div class="roles"><button class="role on" data-role="patient">Patient</button><button class="role" data-role="caregiver">Caregiver</button><button class="role" data-role="pharmacist">Pharmacist</button><button class="role" data-role="doctor">Doctor</button></div></header><main id="app"></main><div id="toast" hidden></div><script>
const DRUGS=['Paracetamol','Ibuprofen','Aceclofenac','Diclofenac','Naproxen','Mefenamic Acid','Amoxicillin','Amoxicillin + Clavulanate','Azithromycin','Cefixime','Cefuroxime','Doxycycline','Clindamycin','Metronidazole','Nitrofurantoin','Ciprofloxacin','Ofloxacin','Moxifloxacin','Clarithromycin','Erythromycin','Linezolid','Pantoprazole','Omeprazole','Rabeprazole','Ondansetron','Domperidone','Lactulose','Sucralfate','Cetirizine','Levocetirizine','Fexofenadine','Montelukast','Salbutamol','Budesonide','Amlodipine','Telmisartan','Losartan','Olmesartan','Ramipril','Metoprolol','Atenolol','Hydrochlorothiazide','Furosemide','Atorvastatin','Rosuvastatin','Clopidogrel','Aspirin','Warfarin','Apixaban','Rivaroxaban','Spironolactone','Digoxin','Metformin','Glimepiride','Gliclazide','Sitagliptin','Empagliflozin','Dapagliflozin','Levothyroxine','Calcium Carbonate + Vitamin D3','Cholecalciferol','Folic Acid','Methylcobalamin','Vitamin B Complex','Vitamin C','Vitamin E','Albendazole','Ivermectin','Fluconazole','Acyclovir','Prednisolone','Dexamethasone','Methylprednisolone','Hydroxychloroquine','Methotrexate','Allopurinol','Febuxostat','Colchicine','Tamsulosin','Finasteride','Dutasteride','Sildenafil','Tadalafil','Clonazepam','Alprazolam','Escitalopram','Sertraline','Fluoxetine','Amitriptyline','Pregabalin','Gabapentin','Duloxetine','Levetiracetam','Sodium Valproate','Carbamazepine','Tramadol','Artificial Tears','Timolol','Latanoprost','Carboxymethylcellulose'];
const RULES=[[/warfarin/i,/ibuprofen|diclofenac|naproxen|mefenamic|aceclofenac|nimesulide/i,'bad','Bleeding risk'],[/warfarin/i,/aspirin|clopidogrel/i,'bad','Major bleeding risk'],[/warfarin/i,/clarithromycin|erythromycin|azithromycin/i,'warn','May increase INR/bleeding risk'],[/rivaroxaban|apixaban/i,/clarithromycin|itraconazole|ketoconazole/i,'bad','May increase anticoagulant exposure'],[/rivaroxaban|apixaban/i,/ibuprofen|diclofenac|naproxen|aspirin/i,'bad','Bleeding risk'],[/clopidogrel/i,/omeprazole|esomeprazole/i,'warn','May reduce clopidogrel activation'],[/telmisartan|losartan|olmesartan|ramipril/i,/potassium|spironolactone/i,'warn','May increase potassium'],[/sildenafil|tadalafil/i,/nitroglycerin|isosorbide/i,'bad','Severe blood-pressure reduction'],[/methotrexate/i,/trimethoprim|ibuprofen|diclofenac|naproxen/i,'bad','Potential methotrexate toxicity'],[/linezolid|tramadol/i,/sertraline|escitalopram|fluoxetine|duloxetine/i,'bad','Serotonin toxicity risk'],[/levothyroxine/i,/calcium|iron|magnesium|sucralfate/i,'warn','May reduce levothyroxine absorption'],[/ciprofloxacin|ofloxacin|moxifloxacin/i,/calcium|iron|magnesium/i,'warn','May reduce antibiotic absorption'],[/metronidazole/i,/alcohol/i,'bad','Avoid combination']];
const seed={name:'Ravindra Deshmukh',age:58,doctor:'Dr. S. Patil',pharmacy:'Rajveer Medical',caregiver:'Sunita Deshmukh',meds:[{id:'m1',name:'Warfarin',dose:'5 mg',route:'Oral',times:['08:00'],status:'confirmed',active:true,adherence:[1,1,1,0,1,1,1],refill:18},{id:'m2',name:'Losartan',dose:'50 mg',route:'Oral',times:['20:00'],status:'confirmed',active:true,adherence:[1,1,1,1,1,1,1],refill:22}],events:[{t:'Today',x:'Warfarin dose marked taken'},{t:'Yesterday',x:'Weekly adherence report generated'}]};let data=JSON.parse(localStorage.getItem('smartmed:v3')||'null')||seed,role='patient',page='dashboard';const save=()=>localStorage.setItem('smartmed:v3',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const hits=n=>{let o=[];for(const m of data.meds.filter(x=>x.active!==false&&x.status==='confirmed'))for(const r of RULES)if((r[0].test(n)&&r[1].test(m.name))||(r[1].test(n)&&r[0].test(m.name)))o.push({with:m.name,level:r[2],reason:r[3]});return o};function toast(x){let t=document.getElementById('toast');t.hidden=false;t.className='toast';t.textContent=x;setTimeout(()=>t.hidden=true,2400)}
const navItems={patient:['dashboard','medications','schedule','adherence','refills','scan','profile'],caregiver:['dashboard','adherence','alerts','medications'],pharmacist:['dashboard','reviews','patients','interactions'],doctor:['dashboard','patients','history']};const labels={dashboard:'⌂ Dashboard',medications:'▣ Medicines',schedule:'◷ Dose Schedule',adherence:'✓ Adherence',refills:'↻ Refills',scan:'⌕ Prescription Scan',profile:'♙ Profile',alerts:'⚠ Alerts',reviews:'✓ Review Queue',patients:'♟ Patients',interactions:'⚕ Interaction Check',history:'▤ History'};
function nav(){return `<aside class="side">${navItems[role].map(x=>`<button class="nav ${page===x?'on':''}" data-page="${x}">${labels[x]}</button>`).join('')}</aside>`}function schedule(){let r=data.meds.filter(m=>m.active!==false&&m.status==='confirmed').flatMap(m=>m.times.map(t=>({t,m}))).sort((a,b)=>a.t.localeCompare(b.t));return r.length?r.map(x=>`<div class="schedule"><b>${x.t}</b><div class="medbox"><b>${esc(x.m.name)}</b><div class="muted small">${esc(x.m.dose)} · ${esc(x.m.route)}</div><div class="actions"><button class="btn primary" data-take="${x.m.id}">✓ Taken</button><button class="btn outline" data-skip="${x.m.id}">Skip</button></div></div></div>`).join(''):'<div class="empty">No doses scheduled.</div>'}
function dashboard(){let a=data.meds.filter(m=>m.active!==false&&m.status==='confirmed'),taken=a.reduce((n,m)=>n+m.adherence.slice(-7).filter(Boolean).length,0),pct=a.length?Math.round(taken/(a.length*7)*100):0;return `<div class="card hero"><div class="small">Smart medication command center</div><h1>${esc(data.name)}</h1><div class="muted">Personalized reminders • safety screening • adherence • refills • care-team workflow</div><div class="actions"><button class="btn white" data-page="schedule">Today's doses</button><button class="btn" style="background:#ffffff22;color:#fff;border:1px solid #ffffff55" data-page="scan">Scan prescription</button></div></div><div class="grid"><div class="card"><div class="muted">Active medicines</div><div class="stat">${a.length}</div></div><div class="card"><div class="muted">7-day adherence</div><div class="stat">${pct}%</div></div><div class="card"><div class="muted">Doses today</div><div class="stat">${a.reduce((n,m)=>n+m.times.length,0)}</div></div><div class="card"><div class="muted">Refills due</div><div class="stat">${a.filter(m=>m.refill<=7).length}</div></div></div><div class="two"><div class="card"><h3>Today's medication plan</h3>${schedule()}</div><div class="card"><h3>Safety center</h3><p class="small muted">New medicines are screened against the embedded pharmacist-curated interaction rules.</p><div class="row"><b>Verification workflow</b><span class="pill good">Active</span></div><div class="row"><b>Pharmacist review</b><span class="pill warn">Required for new Rx</span></div><div class="row"><b>Caregiver alerts</b><span class="pill good">Enabled</span></div></div></div>`}
function meds(){return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>Medication Vault</h2><div class="muted">Prescriptions, doses, safety status and stock.</div></div><button class="btn primary" id="addMed">+ Add medicine</button></div>${data.meds.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.dose)} · ${esc(m.route)} · ${m.times.join(', ')}</div>${m.status==='pending'?'<span class="pill warn">Pending pharmacist review</span>':m.active===false?'<span class="pill neutral">Stopped</span>':'<span class="pill good">Verified</span>'}</div><div class="actions">${m.active!==false?`<button class="btn outline" data-stop="${m.id}">Stop</button>`:''}</div></div>`).join('')}</div>`}
function adherence(){return `<div class="card"><h2>Adherence Intelligence</h2><div class="muted">A simple visual trend from recorded doses.</div>${data.meds.filter(m=>m.status==='confirmed').map(m=>{let a=m.adherence.slice(-7),p=a.length?Math.round(a.filter(Boolean).length/a.length*100):0;return `<div class="row"><div style="min-width:140px"><b>${esc(m.name)}</b><div class="small muted">7 days</div></div><div style="flex:1"><div class="progress"><b style="width:${p}%"></b></div><div class="small muted">${p}% · ${a.map(x=>x?'●':'○').join(' ')}</div></div></div>`}).join('')}</div><div class="card"><b>Smart insight</b><p class="muted small">The app highlights adherence patterns but does not change prescriptions or provide a diagnosis.</p></div>`}
function refills(){return `<div class="card"><h2>Refill Monitor</h2>${data.meds.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="small muted">${m.refill} estimated doses remaining</div></div><div><span class="pill ${m.refill<=7?'bad':m.refill<=14?'warn':'good'}">${m.refill<=7?'Refill now':m.refill<=14?'Refill soon':'Stock OK'}</span><button class="btn outline" data-refill="${m.id}">Update</button></div></div>`).join('')}</div>`}
function scan(){return `<div class="card"><h2>Prescription Intelligence</h2><p class="muted">Capture a prescription, verify extracted medicines, screen interactions, then send for pharmacist approval.</p><input id="rx" type="file" accept="image/*" capture="environment"><div id="preview" class="empty">No prescription image selected.</div><div class="row"><b>1. Capture</b><span class="pill good">Ready</span></div><div class="row"><b>2. Verify OCR / text</b><span class="pill warn">Human verification</span></div><div class="row"><b>3. Safety screen</b><span class="pill good">Automatic demo rules</span></div><div class="row"><b>4. Pharmacist approval</b><span class="pill warn">Required</span></div><div class="row"><b>5. Schedule reminders</b><span class="pill good">After approval</span></div><p class="small muted">This GitHub Pages prototype previews the image; it does not claim clinical-grade OCR accuracy.</p></div>`}
function profile(){return `<div class="card"><h2>Patient & Care Team</h2><label>Name</label><input id="pn" value="${esc(data.name)}"><label>Age</label><input id="pa" type="number" value="${data.age}"><label>Doctor</label><input id="pd" value="${esc(data.doctor)}"><label>Pharmacy</label><input id="pp" value="${esc(data.pharmacy)}"><label>Caregiver</label><input id="pc" value="${esc(data.caregiver)}"><button class="btn primary" id="saveProfile">Save profile</button></div><div class="card"><h3>Privacy</h3><div class="small muted">Demo records are stored locally in this browser. No patient data is sent to a server in this static build.</div></div>`}
function caregiver(){if(page==='alerts')return `<div class="card"><h2>Caregiver Alerts</h2><div class="row"><b>Missed-dose alerts</b><span class="pill good">Enabled</span></div><div class="row"><b>Refill alerts</b><span class="pill good">Enabled</span></div><div class="row"><b>High-risk interaction alerts</b><span class="pill good">Enabled</span></div></div>`;return page==='medications'?meds():page==='adherence'?adherence():dashboard()}
function pharmacist(){if(page==='reviews')return `<div class="card"><h2>Pharmacist Review Queue</h2>${data.meds.filter(m=>m.status==='pending').map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="small muted">${esc(m.dose)} · submitted for verification</div></div><div class="actions"><button class="btn primary" data-approve="${m.id}">Approve</button><button class="btn outline danger" data-reject="${m.id}">Reject</button></div></div>`).join('')||'<div class="empty">No pending prescriptions.</div>'}</div>`;if(page==='interactions')return `<div class="card"><h2>Interaction Command Center</h2>${data.meds.map(m=>{let h=hits(m.name);return `<div class="row"><div><b>${esc(m.name)}</b><div class="small muted">${h.length?h.map(x=>x.with+': '+x.reason).join(' · '):'No matching rule in curated demo set'}</div></div><span class="pill ${h.some(x=>x.level==='bad')?'bad':h.length?'warn':'good'}">${h.some(x=>x.level==='bad')?'High attention':h.length?'Review':'Clear'}</span></div>`}).join('')}</div>`;return dashboard()}
function doctor(){if(page==='history')return `<div class="card"><h2>Medication History</h2><div class="timeline">${data.events.map(e=>`<div><b>${esc(e.t)}</b><div class="muted">${esc(e.x)}</div></div>`).join('')}</div></div>`;return dashboard()}
function content(){if(role==='patient')return ({dashboard,medications:meds,schedule:()=>`<div class="card"><h2>Today's Dose Schedule</h2>${schedule()}</div>`,adherence,refills,scan,profile})[page]();if(role==='caregiver')return caregiver();if(role==='pharmacist')return pharmacist();return doctor()}
function render(){document.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x.dataset.role===role));document.getElementById('app').innerHTML=`<div class="layout">${nav()}<section>${content()}</section></div>`;wire()}
function addMed(){let d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="sheet"><h2>Add medication</h2><label>Medicine</label><input id="drug" placeholder="Search e.g. Metformin"><div id="res"></div><label>Dose</label><input id="dose" placeholder="e.g. 500 mg"><label>Route</label><select id="route"><option>Oral</option><option>Topical</option><option>Inhalation</option><option>Ophthalmic</option></select><label>Times</label><input id="times" value="08:00"><div id="safe"></div><div class="actions"><button class="btn outline" id="cancel">Cancel</button><button class="btn primary" id="add" disabled>Submit for pharmacist review</button></div></div>`;document.body.appendChild(d);let drug=d.querySelector('#drug'),res=d.querySelector('#res'),dose=d.querySelector('#dose'),safe=d.querySelector('#safe'),add=d.querySelector('#add'),chosen='';function check(){let h=chosen?hits(chosen):[];safe.innerHTML=chosen?`<div class="card"><b>Safety screen</b><div style="margin-top:6px">${h.length?h.map(x=>`<span class="pill ${x.level}">${x.reason} with ${esc(x.with)}</span>`).join(' '):'<span class="pill good">No matching rule in demo set</span>'}</div></div>`:'';add.disabled=!(chosen&&dose.value.trim())}drug.oninput=()=>{let q=drug.value.toLowerCase();res.innerHTML=q?`<div class="card" style="padding:0">${DRUGS.filter(x=>x.toLowerCase().includes(q)).slice(0,7).map(x=>`<div class="result" data-x="${esc(x)}">${esc(x)}</div>`).join('')}</div>`:'';res.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{chosen=x.dataset.x;drug.value=chosen;check()});check()};dose.oninput=check;d.querySelector('#cancel').onclick=()=>d.remove();add.onclick=()=>{data.meds.push({id:'m'+Date.now(),name:chosen,dose:dose.value.trim(),route:d.querySelector('#route').value,times:d.querySelector('#times').value.split(',').map(x=>x.trim()).filter(Boolean),status:'pending',active:true,adherence:[],refill:30});data.events.unshift({t:new Date().toLocaleString(),x:`${chosen} submitted for pharmacist review`});save();d.remove();toast('Submitted for pharmacist review');render()}}
function wire(){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;page='dashboard';render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('addMed')?.addEventListener('click',addMed);document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.take);m.adherence.push(1);m.refill=Math.max(0,m.refill-1);data.events.unshift({t:new Date().toLocaleString(),x:`${m.name} dose marked taken`});save();toast('Dose recorded ✓');render()});document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.skip);m.adherence.push(0);data.events.unshift({t:new Date().toLocaleString(),x:`${m.name} dose marked skipped`});save();toast('Dose marked skipped');render()});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.stop);m.active=false;save();toast('Medication stopped in demo record');render()});document.querySelectorAll('[data-refill]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.refill),n=prompt('Estimated doses remaining',m.refill);if(n!==null&&!isNaN(n)){m.refill=Number(n);save();render()}});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.approve);m.status='confirmed';save();toast('Medication approved');render()});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{let m=data.meds.find(x=>x.id===b.dataset.reject);m.status='rejected';m.active=false;save();render()});document.getElementById('saveProfile')?.addEventListener('click',()=>{data.name=document.getElementById('pn').value;data.age=+document.getElementById('pa').value;data.doctor=document.getElementById('pd').value;data.pharmacy=document.getElementById('pp').value;data.caregiver=document.getElementById('pc').value;save();toast('Profile saved');render()});document.getElementById('rx')?.addEventListener('change',e=>{let f=e.target.files[0];if(f)document.getElementById('preview').innerHTML=`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:360px;border-radius:14px"><div class="small muted">Image captured. Verify prescription manually.</div>`})}setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);render();</script></body></html>
